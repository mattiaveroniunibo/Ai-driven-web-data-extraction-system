<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayak - Add Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Add Evento</h1>

    <div class="mb-3">
        <a href="events.html" class="btn btn-outline-secondary">📋 Vedi Lista Eventi</a>
        <a href="tipologie.html" class="btn btn-outline-secondary">⚙️ Gestione Tipologie</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form id="eventForm">
                <div class="mb-3">
                    <label for="tipologia" class="form-label">Tipologia</label>
                    <select class="form-select" id="tipologia" required onchange="loadTipologiaFields()">
                        <option value="">Seleziona tipologia...</option>
                    </select>
                </div>

                <!-- Campi dinamici della tipologia -->
                <div id="dynamicFields"></div>

                <div class="mb-3">
                    <label for="data" class="form-label">Data</label>
                    <input type="datetime-local" class="form-control" id="data" required>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
            </form>

            <div id="message" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
        let tipologie = [];

        // Carica tipologie all'avvio
        loadTipologie();

        async function loadTipologie() {
            try {
                const response = await fetch('/api/tipologie');
                tipologie = await response.json();

                const select = document.getElementById('tipologia');
                select.innerHTML = '<option value="">Seleziona tipologia...</option>';

                tipologie.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.id;
                    option.textContent = t.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Errore caricamento tipologie:', error);
            }
        }

        function loadTipologiaFields() {
            const tipologiaId = document.getElementById('tipologia').value;
            const container = document.getElementById('dynamicFields');

            if (!tipologiaId) {
                container.innerHTML = '';
                return;
            }

            const tipologia = tipologie.find(t => t.id == tipologiaId);
            if (!tipologia) return;

            container.innerHTML = '';

            tipologia.fields.forEach(field => {
                const div = document.createElement('div');
                div.className = 'mb-3';

                let inputHtml = '';
                switch(field.fieldType) {
                    case 'STRING':
                        inputHtml = `<input type="text" class="form-control dynamic-field" data-field="${field.fieldName}" placeholder="${field.fieldName}" required>`;
                        break;
                    case 'NUMBER':
                        inputHtml = `<input type="number" class="form-control dynamic-field" data-field="${field.fieldName}" placeholder="${field.fieldName}" required>`;
                        break;
                    case 'DATE':
                        inputHtml = `<input type="date" class="form-control dynamic-field" data-field="${field.fieldName}" required>`;
                        break;
                    case 'URL':
                        inputHtml = `<input type="url" class="form-control dynamic-field" data-field="${field.fieldName}" placeholder="https://..." required>`;
                        break;
                    case 'FILE':
                        inputHtml = `<input type="file" class="form-control dynamic-field" data-field="${field.fieldName}">`;
                        break;
                    case 'BOOLEAN':
                        inputHtml = `
                            <div class="form-check">
                                <input class="form-check-input dynamic-field" type="checkbox" data-field="${field.fieldName}" id="field-${field.fieldName}">
                                <label class="form-check-label" for="field-${field.fieldName}">${field.fieldName}</label>
                            </div>`;
                        break;
                }

                div.innerHTML = `
                    <label class="form-label">${field.fieldName} <small class="text-muted">(${field.fieldType})</small></label>
                    ${inputHtml}
                `;

                container.appendChild(div);
            });
        }

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const tipologiaId = document.getElementById('tipologia').value;
            const tipologia = tipologie.find(t => t.id == tipologiaId);
            const data = document.getElementById('data').value;

            // Raccogli valori campi dinamici
            const fieldValues = {};
            document.querySelectorAll('.dynamic-field').forEach(input => {
                const fieldName = input.dataset.field;
                if (input.type === 'checkbox') {
                    fieldValues[fieldName] = input.checked;
                } else {
                    fieldValues[fieldName] = input.value;
                }
            });

            // Trova il primo campo di tipo URL
                const urlField = tipologia.fields.find(f => f.fieldType === 'URL');
                const url = urlField ? (fieldValues[urlField.fieldName] || '') : '';

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        url: url,
                        tipologia: tipologia.name,
                        data: data
                    })
                });

                const result = await response.json();
                document.getElementById('message').innerHTML =
                    '<div class="alert alert-success">Evento creato! ID: ' + result.id + '</div>';
                document.getElementById('eventForm').reset();
                document.getElementById('dynamicFields').innerHTML = '';
            } catch (error) {
                document.getElementById('message').innerHTML =
                    '<div class="alert alert-danger">Errore: ' + error + '</div>';
            }
        });
    </script>
</body>
</html>
