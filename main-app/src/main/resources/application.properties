# ==========================================
# PORTA APPLICAZIONE
# ==========================================
quarkus.http.port=8080
quarkus.application.name=kayak-main-app

# ==========================================
# DATABASE MYSQL
# ==========================================
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/kayak_db

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ==========================================
# OLLAMA LOCAL AI (usando API compatibile OpenAI)
# ==========================================
quarkus.langchain4j.openai.base-url=http://localhost:11434/v1
quarkus.langchain4j.openai.api-key=dummy
quarkus.langchain4j.openai.chat-model.model-name=phi3
quarkus.langchain4j.openai.timeout=60s
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# ==========================================
# MCP CLIENT - IMAGE SERVER
# ==========================================
quarkus.langchain4j.mcp.image-downloader.transport-type=http
quarkus.langchain4j.mcp.image-downloader.url=http://localhost:8082/mcp/sse

# ==========================================
# MCP CLIENT - NEWS SERVER
# ==========================================
quarkus.langchain4j.mcp.news-reader.transport-type=http
quarkus.langchain4j.mcp.news-reader.url=http://localhost:8081/mcp/sse

# ==========================================
# LOG LEVEL
# ==========================================
quarkus.log.level=INFO
quarkus.log.category."com.kayak".level=DEBUG